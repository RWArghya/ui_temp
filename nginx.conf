server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # ── SPA fallback ──────────────────────────────
    # All non-file routes fall back to index.html so
    # React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────
    # Proxies /api/* requests to the Go backend.
    #
    # Uses Docker's internal DNS (127.0.0.11) and a
    # variable so Nginx doesn't crash on startup when
    # the backend container isn't running yet.
    #
    # The upstream hostname "backend" must match the
    # service/container name used by the backend's
    # docker-compose on the shared h2s-net network.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;

        proxy_pass         $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static asset caching ─────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
